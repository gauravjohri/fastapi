name: FastAPI CI

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Print Message
        run: echo "hello world"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
    

      - run: pip install -r requirements.txt

      - run: pytest